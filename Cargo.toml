[package]
name = "brk"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Runtime and CLI for tutored coding-dojo plugins"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "brk"
path = "rust/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
